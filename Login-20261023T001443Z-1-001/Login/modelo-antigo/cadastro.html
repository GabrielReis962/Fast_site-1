<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de clientes - Modelo antigo</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <h1>Cadastro de clientes</h1>
            <a href="../principal.html">Voltar para a página principal</a>
        </header>

        <form id="client-form">
            <fieldset>
                <legend>Preencha os dados do cliente</legend>

                <label for="name">Nome completo:</label>
                <input id="name" name="name" maxlength="120" autocomplete="name" required>

                <label for="phone">Telefone:</label>
                <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel" required>

                <label for="email">E-mail:</label>
                <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>

                <label for="cpf">CPF:</label>
                <input id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>

                <label for="address">Endereço completo:</label>
                <input id="address" name="address" maxlength="200" autocomplete="street-address" required>

                <label for="observation">Observações:</label>
                <textarea id="observation" name="observation" rows="4" maxlength="1000"></textarea>

                <p id="form-message" role="status" aria-live="polite"></p>
                <button id="save-button" type="submit">Salvar cadastro</button>
            </fieldset>
        </form>
    </main>

    <script>
        const BASE_URL = "http://127.0.0.1:8080";
        const form = document.querySelector("#client-form");
        const message = document.querySelector("#form-message");
        const saveButton = document.querySelector("#save-button");

        async function loadSession() {
            try {
                const response = await fetch(`${BASE_URL}/api/auth/session`, {
                    cache: "no-store",
                    credentials: "include",
                });
                const session = await response.json();

                if (!response.ok || !session.authenticated) {
                    window.location.replace("../Login.html");
                }
            } catch (error) {
                console.error("Não foi possível verificar a sessão:", error);
                message.textContent = "Não foi possível conectar ao servidor. Entre novamente.";
                window.location.replace("../Login.html");
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "";
            saveButton.disabled = true;

            try {
                const response = await fetch(`${BASE_URL}/api/clients`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify(Object.fromEntries(new FormData(form).entries())),
                });
                const result = await response.json();

                if (response.status === 401) {
                    window.location.replace("../Login.html");
                    return;
                }
                if (!response.ok) {
                    throw new Error(result.error || "Não foi possível salvar o cadastro.");
                }

                form.reset();
                message.textContent = result.message || "Cadastro salvo com sucesso.";
            } catch (error) {
                console.error("Não foi possível salvar o cadastro:", error);
                message.textContent = error.message;
            } finally {
                saveButton.disabled = false;
            }
        });

        loadSession();
    </script>
</body>
</html>
